name: Manual Telegram Promocode Sync (Backup)

# Cron schedule disabled because Render.com is running 24/7 in real-time!
on:
  workflow_dispatch:

jobs:
  telegram_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: pip install -r requirements.txt

      - name: Run Telegram Sync
        env:
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TARGET_CHANNEL_ID: -1001899529343
        run: |
          python -c '
          import os, asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telegram_channel_listener import parse_promocode, sync_to_firebase, TARGET_CHANNEL_ID, API_ID, API_HASH

          async def run():
              session = os.getenv("TELEGRAM_SESSION_STRING", "").strip()
              if not session:
                  print("❌ Error: TELEGRAM_SESSION_STRING is missing in Secrets!")
                  return

              client = TelegramClient(StringSession(session), API_ID, API_HASH)
              await client.start()
              print(f"🟢 Connected to Telegram! Accessing Private Channel ID: {TARGET_CHANNEL_ID}...")

              try:
                  ch = await client.get_entity(TARGET_CHANNEL_ID)
                  ch_title = getattr(ch, "title", "Private Channel")
                  print(f"✅ Found Private Channel: {ch_title} (ID: {TARGET_CHANNEL_ID})")
                  
                  synced_codes = set()
                  count = 0
                  async for msg in client.iter_messages(ch, limit=25):
                      text = msg.message or msg.text or ""
                      if not text.strip(): continue
                      g, c, b, link = parse_promocode(text)
                      if c and c.upper() not in synced_codes:
                          synced_codes.add(c.upper())
                          print(f"🎯 Checking Code: \"{c}\" | Game: \"{g}\"")
                          sync_to_firebase(g, c, b, link, text)
                          count += 1
                          
                  print(f"🏁 Finished scanning: {count} codes checked.")
              except Exception as e:
                  print(f"❌ Error connecting to channel {TARGET_CHANNEL_ID}: {e}")

              await client.disconnect()

          asyncio.run(run())
          '
