name: 24/7 Telegram Promocode Auto-Sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  telegram_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: pip install -r requirements.txt

      - name: Run Telegram Sync
        env:
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: |
          python -c '
          import os, asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telegram_channel_listener import parse_promocode, sync_to_firebase, TARGET_CHANNEL, API_ID, API_HASH

          async def run():
              session = os.getenv("TELEGRAM_SESSION_STRING", "").strip()
              if not session:
                  print("Error: TELEGRAM_SESSION_STRING is missing in Secrets!")
                  return
              client = TelegramClient(StringSession(session), API_ID, API_HASH)
              await client.start()
              print("Connected to Telegram! Checking channel...")
              async for dialog in client.iter_dialogs():
                  if TARGET_CHANNEL.lower() in dialog.name.lower():
                      async for msg in client.iter_messages(dialog.id, limit=5):
                          text = msg.text or ""
                          if not text: continue
                          g, c, b = parse_promocode(text)
                          if c:
                              sync_to_firebase(g, c, b)
                              break
                      break
              await client.disconnect()

          asyncio.run(run())
          '
